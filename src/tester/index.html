<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word tester – Collens Group</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Word gratis tester van LubbyC en Koffer Vol! op Android.">
<link rel="icon" href="/img/favicon-48.png">
<style>
  :root { --ink:#13302B; --ink2:#1E4A41; --cream:#F6F0E6; --gold:#C49A4A; --muted:#5E6B66; --card:#FFFFFF; --line:#E6DCCB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Thai", "Noto Sans Myanmar", sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header img { height:34px; }
  select { font:inherit; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); max-width:55%; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; font-size:32px; line-height:1.15; margin:26px 0 10px; }
  .intro { color:var(--muted); margin:0 0 22px; }
  .stap { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px; display:flex; gap:14px; }
  .nr { flex:none; width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--cream); display:flex; align-items:center; justify-content:center; font-weight:700; }
  .stap h2 { font-size:18px; margin:4px 0 6px; }
  .stap p { margin:0 0 12px; color:var(--muted); }
  .knop { display:flex; align-items:center; gap:12px; width:100%; text-decoration:none; background:var(--ink); color:#fff; border-radius:14px; padding:14px 16px; font-weight:700; margin-top:8px; min-height:52px; }
  .knop:active { transform:scale(.99); }
  .knop.app { background:#fff; color:var(--ink); border:1.5px solid var(--ink); }
  .knop img { width:32px; height:32px; border-radius:8px; }
  .knop .pijl { margin-left:auto; opacity:.7; }
  .let { background:#FBF6EC; border:1px dashed var(--gold); border-radius:14px; padding:12px 14px; color:var(--ink); font-size:15px; margin:18px 0 10px; }
  .klein { color:var(--muted); font-size:14px; margin:6px 0; }
  a.mail { color:var(--ink2); font-weight:700; }
  footer { margin-top:26px; text-align:center; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/"><img src="/img/collens-group-logo.png" alt="Collens Group"></a>
    <select id="taal" aria-label="Language"></select>
  </header>
  <h1 data-t="titel"></h1>
  <p class="intro" data-t="intro"></p>

  <div class="stap"><div class="nr">1</div><div style="flex:1">
    <h2 data-t="s1t"></h2><p data-t="s1"></p>
    <a class="knop" id="groep" target="_blank" rel="noopener"><span data-t="s1k"></span><span class="pijl">›</span></a>
  </div></div>

  <div class="stap"><div class="nr">2</div><div style="flex:1">
    <h2 data-t="s2t"></h2><p data-t="s2"></p>
    <a class="knop app" id="lubbyc" target="_blank" rel="noopener"><img src="/img/lubbyc-icon.png" alt="">LubbyC<span class="pijl">›</span></a>
    <a class="knop app" id="koffer" target="_blank" rel="noopener"><img src="/img/koffervol-icon.png" alt="">Koffer Vol!<span class="pijl">›</span></a>
  </div></div>

  <div class="stap"><div class="nr">3</div><div style="flex:1">
    <h2 data-t="s3t"></h2><p data-t="s3" style="margin:0"></p>
  </div></div>

  <div class="let" data-t="nog"></div>
  <p class="klein"><strong data-t="dank"></strong></p>
  <p class="klein" data-t="priv"></p>
  <p class="klein"><span data-t="vraag"></span> <a class="mail" href="mailto:info@collensgroup.com">info@collensgroup.com</a></p>
  <footer>© Collens Group</footer>
</div>
<script src="talen.js"></script>
<script>
(function () {
  var T = window.TESTER_TALEN, V = window.TESTER_VOLGORDE, L = window.TESTER_LINKS;
  var sel = document.getElementById('taal');
  V.forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = T[k].vlag + ' ' + T[k].naam; sel.appendChild(o); });
  function kies() {
    var p = new URLSearchParams(location.search).get('l');
    if (p && T[p]) return p;
    var langs = (navigator.languages || [navigator.language || 'en']);
    for (var i = 0; i < langs.length; i++) { var c = String(langs[i]).slice(0, 2).toLowerCase(); if (T[c]) return c; }
    return 'en';
  }
  function zet(k) {
    var t = T[k]; document.documentElement.lang = k; document.title = t.titel + ' – Collens Group';
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')] || ''; });
    sel.value = k;
  }
  document.getElementById('groep').href = L.groep;
  document.getElementById('lubbyc').href = L.lubbyc;
  document.getElementById('koffer').href = L.koffer;
  sel.addEventListener('change', function () {
    zet(sel.value);
    try { var u = new URL(location.href); u.searchParams.set('l', sel.value); history.replaceState(null, '', u); } catch (e) {}
  });
  zet(kies());
})();
</script>
</body>
</html>
